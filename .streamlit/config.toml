# One theme for the whole app. Pages also inject ui_theme.CSS so charts
# and custom chrome stay readable even if a viewer has dark-mode OS prefs.
[theme]
base = "light"
primaryColor = "#1F6B6B"
backgroundColor = "#F3F5F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2430"
font = "sans serif"
